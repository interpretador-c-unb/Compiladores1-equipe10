site_name: Interpretador C - Equipe 10
docs_dir: documentos

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.follow

markdown_extensions:
  - admonition
  - codehilite
  - tables
  - pymdownx.superfences

nav:
  - Estrutura do Projeto: index.md
  - Guia de uso: guia-uso.md
  - Decisões Técnicas: decisoes-tecnicas.md
  - Analisador Léxico: analisador-lexico.md
  - Gramática & BNF: gramatica-bnf.md
  - Analisador Sintático: analisador-sintatico.md
  - Tabela de Símbolos: tabela-simbolos.md
  - Análise Semântica: analise-semantica.md
  - Interpretador e Runtime: interpretador.md
  - Planejamento das Sprints: planejamento-sprints.md
  - Problemas e Soluções: problemas-e-solucoes.md
  - Débitos Técnicos: debitos-tecnicos.md
  - Plano Pós-P1: plano-pos-p1.md